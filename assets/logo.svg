  <line x1="40" y1="72" x2="36" y2="88" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="78" y1="72" x2="82" y2="88" stroke="#8B5A2B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- saddle -->
  <ellipse cx="66" cy="56" rx="10" ry="6" fill="#FFF8E7" opacity="0.85"/>
