<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="LinkHub Demo logo">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="50%" stop-color="#FF6B9D"/>
      <stop offset="100%" stop-color="#7EC8E3"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#FFF5E0" stroke="#E8D5B5" stroke-width="3"/>
  <!-- rocking horse body -->
  <ellipse cx="62" cy="62" rx="28" ry="18" fill="url(#body)"/>
  <path d="M38 58 Q30 42 42 36 Q52 32 58 42" fill="#FF8A65" stroke="#D35400" stroke-width="1.5"/>
  <circle cx="48" cy="40" r="3" fill="#2C3E50"/>
